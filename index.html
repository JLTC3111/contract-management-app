<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Open Graph -->
    <meta property="og:title" content="Contract Manager" />
    <meta property="og:description" content="Contract management for ICUE." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://contract.icue.vn/preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://contract.icue.vn" />
    
    <title>Contract Manager</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logoIcons/favicon.png">

    <!-- No stylesheet links: src/index.css and src/App.css are imported by
         src/App.jsx and bundled by Vite. Icons come from lucide-react and flags
         from public/flags/, so there is nothing to fetch off a CDN either. -->
  </head>
  <body>
    <div id="root">
      <main role="status" style="max-width:560px;margin:12vh auto;padding:24px;font:16px/1.5 system-ui,sans-serif">
        <p>Loading Contract Manager…</p>
        <p>If loading is interrupted, check your connection and reload.</p>
        <button type="button" onclick="window.location.reload()" style="min-height:44px;padding:10px 24px;font:inherit;cursor:pointer">Reload</button>
        <noscript><p>Enable JavaScript in your browser to open the app.</p></noscript>
      </main>
    </div>

    <!-- jszip is a dependency and is imported where it is used, so it ships in the
         bundle - pulling it off a CDN here loaded it a second time, for nothing. -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
